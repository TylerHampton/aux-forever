<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post panel, option A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1a1a}
a{color:#e5be5b}a:hover{color:#f2d48a}
.g{color:#ffd70a}.s{color:#c7c7cf}.c{color:#eda55f}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 884px; height: 214px; box-sizing: border-box; background: #131313; border: 1px solid #000; font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; color: #ebebeb; padding: 10px 12px; display: grid; grid-template-columns: 206px 1px minmax(0, 1fr) 1px 252px; column-gap: 14px;">

  <!-- 1. what and how many -->
  <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <div style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border: 1px solid #1eff00; background: linear-gradient(135deg, #5b6f86, #2a3340); border-radius: 2px;" role="img" aria-label="Medicine Staff icon"></div>
      <div style="min-width: 0;">
        <div style="font-size: 17px; color: #1eff00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Medicine Staff</div>
        <div style="font-size: 13px; color: #a8a8a8;">1 in your bags</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="width: 58px; font-size: 13px; color: #a8a8a8;">Count</span>
      <button style="width: 24px; height: 24px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #ebebeb; font-size: 15px; padding: 0;" aria-label="One less">-</button>
      <input value="1" aria-label="Count" style="width: 44px; height: 24px; box-sizing: border-box; background: #0c0c0c; border: 1px solid #404040; color: #ebebeb; font-size: 16px; text-align: center;">
      <button style="width: 24px; height: 24px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #ebebeb; font-size: 15px; padding: 0;" aria-label="One more">+</button>
      <button style="width: 38px; height: 24px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #e5be5b; font-size: 13px; padding: 0;">Max</button>
    </div>
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="width: 58px; font-size: 13px; color: #a8a8a8;">Duration</span>
      <button style="width: 40px; height: 24px; background: #2a2312; border: 1px solid #e5be5b; color: #e5be5b; font-size: 13px; padding: 0;">2h</button>
      <button style="width: 40px; height: 24px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #ebebeb; font-size: 13px; padding: 0;">8h</button>
      <button style="width: 40px; height: 24px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #ebebeb; font-size: 13px; padding: 0;">24h</button>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #a8a8a8; margin-top: auto;">
      <input type="checkbox" style="width: 13px; height: 13px; margin: 0; accent-color: #e5be5b;">Hide from this list
    </label>
  </div>

  <div style="background: #000;"></div>

  <!-- 2. the price -->
  <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="display: flex;">
        <button style="height: 26px; padding: 0 10px; background: #2a2312; border: 1px solid #e5be5b; color: #e5be5b; font-size: 14px;">Match lowest</button>
        <button style="height: 26px; padding: 0 10px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; border-left: none; color: #a8a8a8; font-size: 14px; display: flex; align-items: center; gap: 5px;"><img src="/_blob/31e0cd64cf170289470413768d9a13af" alt="" style="width: 18px; height: 18px; opacity: .55;">Undercut</button>
      </div>
      <button style="width: 24px; height: 26px; background: linear-gradient(#2a2a2a, #1d1d1d); border: 1px solid #000; color: #ebebeb; font-size: 14px; padding: 0;" aria-label="Match lowest or undercut, explained">?</button>
    </div>
    <div style="display: grid; grid-template-columns: 74px 128px 56px; column-gap: 10px; row-gap: 6px; align-items: center;">
      <span></span>
      <span style="font-size: 11px; letter-spacing: .06em; color: #6b6b6b; text-align: right;">PER ITEM</span>
      <span style="font-size: 11px; letter-spacing: .06em; color: #6b6b6b;">OF USUAL</span>

      <span style="font-size: 13px; color: #a8a8a8;">Starting bid</span>
      <div style="height: 28px; box-sizing: border-box; background: #0c0c0c; border: 1px solid #404040; display: flex; align-items: center; justify-content: flex-end; padding: 0 9px; font-size: 18px;">15<span class="s">s</span></div>
      <span style="font-size: 15px; color: #f0943c;">125%</span>

      <span style="font-size: 13px; color: #a8a8a8;">Buyout</span>
      <div style="height: 28px; box-sizing: border-box; background: #0c0c0c; border: 1px solid #e5be5b; display: flex; align-items: center; justify-content: flex-end; padding: 0 9px; font-size: 18px;">15<span class="s">s</span></div>
      <span style="font-size: 15px; color: #f0943c;">125%</span>
    </div>
    <div style="font-size: 13px; color: #a8a8a8; line-height: 1.35;">
      Same as the lowest listing<br>
      <span style="color: #6b6b6b;">Bid equals buyout, so it posts as buyout only</span>
    </div>
  </div>

  <div style="background: #000;"></div>

  <!-- 3. the receipt -->
  <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
    <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: #a8a8a8;">Total, 1 item</span><span>15<span class="s">s</span></span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: #a8a8a8;">Auction house cut 5%</span><span style="color: #e8574a;">-75<span class="c">c</span></span></div>
    <div style="height: 1px; background: #2e2e2e;"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 15px; color: #ebebeb;">You get</span><span style="font-size: 19px; color: #e8574a;">14<span class="s">s</span> 25<span class="c">c</span></span></div>
    <div style="display: flex; align-items: center; gap: 7px; background: rgba(232,87,74,.16); border: 1px solid #e8574a; padding: 3px 7px; font-size: 14px; color: #ffb3ab;">
      <svg width="20" height="18" viewBox="0 0 20 18" role="img" aria-label="Warning"><path d="M10 1 L19 17 L1 17 Z" fill="#e8574a" stroke="#e8574a" stroke-width="1.5" stroke-linejoin="round"></path><rect x="9" y="6" width="2" height="6" fill="#131313"></rect><rect x="9" y="13.5" width="2" height="2" fill="#131313"></rect></svg>
      <span style="flex-grow: 1;">Vendor pays more</span><span style="color: #ebebeb;">14<span class="s">s</span> 87<span class="c">c</span></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6b6b6b;"><span>Deposit now, back if it sells</span><span style="color: #e8574a;">-74<span class="c">c</span></span></div>
    <button style="margin-top: auto; height: 30px; background: #2a2312; border: 1px solid #e5be5b; color: #e5be5b; font-size: 17px;">Post 1 item</button>
  </div>
</div>
</x-dc>

</body>
</html>
