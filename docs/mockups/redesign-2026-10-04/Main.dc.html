<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aux search tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e3a43b}a:hover{color:#f2c46d}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1100px; height: 700px; box-sizing: border-box; background: #0c0d0f; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; color: #e6e2d8">
<div style="width: 1060px; height: 660px; background: #16181b; border: 1px solid #2b2f35; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,0.55)">

<div style="height: 46px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: #111315; border-bottom: 1px solid #262a2f">
<div style="font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: #e3a43b">aux</div>
<div style="display: flex; gap: 4px">
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 6px; background: #262a30; color: #f3efe6; font-size: 15px; font-weight: 600">Search</button>
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 15px; font-weight: 500">Post</button>
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 15px; font-weight: 500">Auctions</button>
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 15px; font-weight: 500">Bids</button>
</div>
<div style="flex-grow: 1"></div>
<button style="height: 30px; padding: 0 12px; border: 1px solid #2f343a; border-radius: 6px; background: #1b1e22; color: #cfcac0; font-size: 14px">Full scan <span style="color: #7d7a73">ready</span></button>
<button style="height: 30px; padding: 0 12px; border: 1px solid #2f343a; border-radius: 6px; background: #1b1e22; color: #6fb4ff; font-size: 14px">Blizzard UI</button>
<button aria-label="Close" style="width: 30px; height: 30px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 18px">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"></path></svg>
</button>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px 14px">
<button aria-label="Previous search" style="width: 32px; height: 34px; border: 1px solid #2f343a; border-radius: 6px; background: #1b1e22; color: #cfcac0">
<svg width="10" height="14" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1L2 7l6 6"></path></svg>
</button>
<button aria-label="Next search" style="width: 32px; height: 34px; border: 1px solid #2f343a; border-radius: 6px; background: #1b1e22; color: #5d5a54">
<svg width="10" height="14" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l6 6-6 6"></path></svg>
</button>
<label style="flex-grow: 1; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #3a3f46; border-radius: 6px; background: #0f1113">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#7d7a73" stroke-width="1.6"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5L13 13" stroke-linecap="round"></path></svg>
<input aria-label="Search filter" value="light feather/exact" style="flex-grow: 1; border: none; background: transparent; color: #f3efe6; font-size: 16px; outline: none">
</label>
<button style="height: 34px; padding: 0 12px; border: 1px solid #2f343a; border-radius: 17px; background: #1b1e22; color: #a8a49b; font-size: 14px; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5d5a54"></span>Live</button>
<button style="height: 34px; padding: 0 20px; border: none; border-radius: 6px; background: #e3a43b; color: #1a1408; font-size: 16px; font-weight: 700">Search</button>
</div>

<div style="display: flex; align-items: center; gap: 4px; padding: 0 14px 10px 14px">
<button style="height: 28px; padding: 0 12px; border: none; border-radius: 6px; background: #262a30; color: #f3efe6; font-size: 14px; font-weight: 600">Results <span style="color: #e3a43b">11</span></button>
<button style="height: 28px; padding: 0 12px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 14px">Saved searches</button>
<button style="height: 28px; padding: 0 12px; border: none; border-radius: 6px; background: transparent; color: #a8a49b; font-size: 14px">Filter builder</button>
<div style="flex-grow: 1"></div>
<div style="font-size: 13px; color: #7d7a73">11 price levels · 6,180 for sale · searched 4s ago</div>
</div>

<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 14px; border: 1px solid #262a2f; border-radius: 8px; overflow: hidden">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 44px 92px 64px 56px 120px 90px 104px 84px; align-items: center; height: 34px; padding: 0 12px; background: #1d2024; color: #8e8a81; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px">
<div>Item</div><div style="text-align: center">Lvl</div><div style="text-align: right">For sale</div><div style="text-align: center">Auctions</div><div style="text-align: center">Left</div><div style="text-align: center">Seller</div><div style="text-align: right">Bid</div><div style="text-align: right; color: #e3a43b">Price each</div><div style="text-align: right">Value</div>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="11">
<div style="{{row.style}}">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="width: 22px; height: 22px; border-radius: 4px; background: #2a2e34; border: 1px solid #3a3f46; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#d9d3c4" stroke-width="1.3" stroke-linecap="round"><path d="M12 2C7 2 3 6 3 11l-1 1M3 11c3 0 6-2 7-5M5 8h3"></path></svg>
</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Light Feather</span>
</div>
<div style="text-align: center; color: #8e8a81">1</div>
<div style="text-align: right; font-variant-numeric: tabular-nums">{{row.qty}}</div>
<div style="text-align: center; color: #8e8a81">1</div>
<div style="{{row.leftStyle}}">{{row.left}}</div>
<div style="text-align: center; color: #8e8a81">{{row.seller}}</div>
<div style="text-align: right; color: #5d5a54">no bids</div>
<div style="text-align: right; font-variant-numeric: tabular-nums; color: #f0e2b8; font-weight: 600">{{row.price}}</div>
<div style="text-align: right"><span style="{{row.pctStyle}}">{{row.pct}}</span></div>
</div>
</sc-for>
</div>
</div>

<div style="margin: 10px 14px 14px 14px; padding: 12px 14px; border: 1px solid #3b3426; border-radius: 8px; background: #1b1a17; display: flex; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; width: 190px; flex-shrink: 0">
<span style="width: 36px; height: 36px; border-radius: 6px; background: #2a2e34; border: 1px solid #4a4436; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 14 14" fill="none" stroke="#e9e2d0" stroke-width="1.1" stroke-linecap="round"><path d="M12 2C7 2 3 6 3 11l-1 1M3 11c3 0 6-2 7-5M5 8h3"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 600; color: #f3efe6">Light Feather</div>
<div style="font-size: 13px; color: #8e8a81">6,180 for sale · stack of 20</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 5px">
<div style="font-size: 12px; color: #8e8a81; text-transform: uppercase; letter-spacing: 0.6px">Quantity</div>
<div style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<button onClick="{{chip.pick}}" style="{{chip.style}}">
<span style="font-size: 17px; font-weight: 700; line-height: 18px">{{chip.label}}</span>
<span style="{{chip.subStyle}}">{{chip.cost}}</span>
</button>
</sc-for>
<label style="height: 44px; width: 70px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; border: 1px solid {{customBorder}}; border-radius: 6px; background: #0f1113">
<span style="font-size: 11px; color: #8e8a81">Other</span>
<input aria-label="Other quantity" type="number" min="1" value="{{qtyText}}" onChange="{{onQty}}" style="width: 100%; border: none; background: transparent; color: #f3efe6; font-size: 16px; font-weight: 600; outline: none; padding: 0">
</label>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 15px; color: #f3efe6">{{summary}}</div>
<div style="{{detailStyle}}">{{detail}}</div>
</div>

<sc-if value="{{isQuote}}" hint-placeholder-val="{{ false }}">
<button onClick="{{cancel}}" style="height: 44px; padding: 0 14px; border: 1px solid #3a3f46; border-radius: 6px; background: transparent; color: #cfcac0; font-size: 15px">Cancel</button>
</sc-if>
<button onClick="{{primary}}" style="{{primaryStyle}}">{{primaryLabel}}</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":700}}'>
var TIERS = [[5953,7,"24h","?"],[17,8,"24h","?"],[1,9,"12h","?"],[43,10,"24h","?"],[20,11,"2h","?"],[51,15,"12h","?"],[3,50,"12h","?"],[8,107,"24h","?"],[17,307,"12h","?"],[20,607,"12h","?"],[47,907,"12h","?"]];
var VALUE = 6;
var STACK = 20;
function money(c) {
  var g = Math.floor(c / 10000), s = Math.floor((c % 10000) / 100), k = c % 100;
  var out = [];
  if (g) out.push(g + 'g');
  if (s) out.push(s + 's');
  if (k || !out.length) out.push(k + 'c');
  return out.join(' ');
}
function estimate(n) {
  var total = 0, max = 0, left = n;
  for (var i = 0; i < TIERS.length && left > 0; i++) {
    var take = Math.min(left, TIERS[i][0]);
    total += take * TIERS[i][1];
    max = TIERS[i][1];
    left -= take;
  }
  return { total: total, max: max, ok: left === 0 };
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qty: STACK, phase: 'choose' };
  }
  setQty(q) {
    this.setState({ qty: q, phase: 'choose' });
  }
  renderVals() {
    var self = this;
    var qty = this.state.qty;
    var phase = this.state.phase;
    var est = estimate(qty);
    var rows = TIERS.map(function (t, i) {
      var pct = Math.round(100 * t[1] / VALUE);
      var color = pct <= 120 ? '#6fd39a' : (pct <= 200 ? '#e3a43b' : '#ff6b5e');
      var bg = i === 0 ? '#2a2414' : (i % 2 ? '#191b1e' : '#16181b');
      return {
        qty: t[0].toLocaleString('en-US'),
        price: money(t[1]),
        left: t[2],
        leftStyle: 'text-align: center; color: ' + (t[2] === '2h' ? '#e3a43b' : '#8e8a81'),
        seller: t[3],
        pct: pct > 9999 ? '>9999%' : pct + '%',
        pctStyle: 'display: inline-block; min-width: 54px; text-align: center; padding: 2px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: ' + color + '; background: rgba(255,255,255,0.04)',
        style: 'display: grid; grid-template-columns: minmax(0, 1fr) 44px 92px 64px 56px 120px 90px 104px 84px; align-items: center; height: 30px; padding: 0 12px; font-size: 15px; border-bottom: 1px solid #202327; background: ' + bg + (i === 0 ? '; box-shadow: inset 0 0 0 1px #6b5524' : '')
      };
    });
    var chips = [1, 5, 10, STACK].map(function (n) {
      var e = estimate(n);
      var on = n === qty;
      return {
        label: n === STACK ? n + ' stack' : String(n),
        cost: money(e.total),
        pick: function () { self.setQty(n); },
        style: 'height: 44px; min-width: ' + (n === STACK ? 78 : 56) + 'px; padding: 0 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 6px; border: 1px solid ' + (on ? '#e3a43b' : '#3a3f46') + '; background: ' + (on ? '#3a2e15' : '#1f2226') + '; color: ' + (on ? '#f6d48f' : '#e6e2d8'),
        subStyle: 'font-size: 12px; color: ' + (on ? '#e3c27f' : '#8e8a81')
      };
    });
    var isChip = [1, 5, 10, STACK].indexOf(qty) >= 0;
    var summary, detail, detailStyle = 'font-size: 13px; color: #8e8a81';
    var primaryLabel = 'Buy ' + qty + ' for ' + money(est.total);
    var primaryStyle = 'height: 44px; padding: 0 18px; border: none; border-radius: 6px; background: #e3a43b; color: #1a1408; font-size: 16px; font-weight: 700; white-space: nowrap';
    if (!est.ok || qty < 1) {
      summary = qty < 1 ? 'Choose how many to buy' : 'Only 6,180 for sale';
      detail = 'Pick a quantity above';
      primaryLabel = 'Buy';
      primaryStyle = 'height: 44px; padding: 0 18px; border: none; border-radius: 6px; background: #2b2f35; color: #6b675f; font-size: 16px; font-weight: 700';
    } else if (phase === 'choose') {
      summary = qty + ' Light Feathers for ' + money(est.total);
      detail = 'Cheapest first · avg ' + money(Math.ceil(est.total / qty)) + ' · highest ' + money(est.max) + ' each';
    } else if (phase === 'quote') {
      summary = 'Server price: ' + money(est.total) + ' for ' + qty;
      detail = 'Matches the estimate. Nothing is bought until you confirm.';
      detailStyle = 'font-size: 13px; color: #6fd39a';
      primaryLabel = 'Confirm ' + money(est.total);
      primaryStyle = 'height: 44px; padding: 0 18px; border: none; border-radius: 6px; background: #3fae6a; color: #06150c; font-size: 16px; font-weight: 700; white-space: nowrap';
    } else {
      summary = 'Bought ' + qty + ' Light Feathers for ' + money(est.total);
      detail = 'They are on the way to your mailbox.';
      detailStyle = 'font-size: 13px; color: #6fd39a';
    }
    return {
      rows: rows,
      chips: chips,
      qtyText: isChip ? '' : String(qty),
      customBorder: isChip ? '#3a3f46' : '#e3a43b',
      onQty: function (e) { var v = parseInt(e.target.value, 10); self.setQty(isNaN(v) ? 0 : v); },
      summary: summary,
      detail: detail,
      detailStyle: detailStyle,
      isQuote: phase === 'quote',
      primaryLabel: primaryLabel,
      primaryStyle: primaryStyle,
      primary: function () {
        if (!est.ok || qty < 1) return;
        self.setState({ phase: phase === 'quote' ? 'done' : 'quote' });
      },
      cancel: function () { self.setState({ phase: 'choose' }); }
    };
  }
}
</script>
</body>
</html>
