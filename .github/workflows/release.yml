name: Release

# Publishes a GitHub Release with the installable zip attached and the version's notes from
# docs/changelog.md. Two ways to start it:
#   - Actions tab, Release, "Run workflow" on main: releases the version in auxForever.toc and
#     creates its tag (v0.2.1 for forever-0.2.1).
#   - pushing a tag like v0.2.1; the tag must match the version in auxForever.toc.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the version
        run: |
          version=$(sed -n 's/^## Version: forever-//p' auxForever/auxForever.toc | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the Version line in auxForever.toc ($version)"
            exit 1
          fi
          grep -q "^## $version " docs/changelog.md || {
            echo "docs/changelog.md has no section for $version"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Tests
        run: |
          for f in $(find auxForever tests -name '*.lua'); do luac5.1 -p "$f"; done
          cd auxForever
          lua5.1 ../tests/load_test.lua | tee ../test-output.txt
          tail -n 1 ../test-output.txt | grep -qx 'done, errors: 0'

      - name: Package
        run: zip -qr "auxForever-$VERSION.zip" auxForever -x '*.git*'

      - name: Release notes
        run: |
          {
            echo "Download **auxForever-$VERSION.zip** below, unzip it and copy the \`auxForever\` folder into \`World of Warcraft\\_classic_beta_\\Interface\\AddOns\`, replacing the old one."
            echo
            awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {p = 1; next} /^## / && p {exit} p' docs/changelog.md
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: auxForever ${{ env.VERSION }}
          body_path: notes.md
          files: auxForever-${{ env.VERSION }}.zip
          prerelease: true
